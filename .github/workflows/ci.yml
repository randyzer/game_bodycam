name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://bodycamwiki.top
      SITE_INDEXABLE: 'false'
      SITE_ADS_ENABLED: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          require-lockfile: true
          cache: true

      - name: Test
        run: pnpm test

      - name: Check types
        run: pnpm typecheck

      - name: Build
        run: pnpm build
